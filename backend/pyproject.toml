[project]
name = "minlish-backend"
version = "0.1.0"
description = "FastAPI backend for MinLish"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13.3",
    "bcrypt>=4.2.0",
    "fastapi[standard]>=0.115.0",
    "pydantic-settings>=2.5.2",
    "psycopg[binary]>=3.2.3",
    "python-jose[cryptography]>=3.3.0",
    "sqlalchemy>=2.0.35",
]

[dependency-groups]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.9",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
